    <style>
      /* =========================================================
         Universal Single-Screen Layout Reset (No Vertical Scroll)
         كود عام شامل لإصلاح اختفاء الأزرار والتمرير على كل الشاشات
         ========================================================= */

      /* 1. قفل الصفحة الخارجية لمنع شريط التمرير الخارجي */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        height: 100dvh !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
      }

      *, *::before, *::after {
        box-sizing: inherit !important;
      }

      /* 2. تحويل جسم الصفحة أو الحاوية الكبرى إلى Flexbox عمودي محدد بارتفاع الشاشة */
      body, 
      body > div:first-child, 
      .app-wrapper, 
      #app, 
      #root {
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        height: 100% !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        width: 100% !important;
        max-width: 900px;
        margin: 0 auto !important;
        overflow: hidden !important;
      }

      /* 3. حماية العناصر العلوية (الهيدر/العنوان) من الانكماش */
      header, 
      .header, 
      .app-header, 
      [class*="header"] {
        flex-shrink: 0 !important;
        width: 100% !important;
        z-index: 10;
      }

      /* 4. حماية العناصر السفلية (الأزرار/الشريط السفلي/التنقل) من الاختفاء أو الانكماش */
      footer, 
      nav, 
      .navbar, 
      .bottom-nav, 
      .buttons-container, 
      [class*="nav"], 
      [class*="footer"], 
      [class*="button"] {
        flex-shrink: 0 !important;
        width: 100% !important;
        z-index: 10;
      }

      /* 5. تجاوب منطقة المحتوى الوسطى: مرونة كاملة + سماح بالانكماش + صمام أمان */
      main, 
      .main, 
      .content, 
      .main-content, 
      [class*="content"], 
      [class*="container"]:not(body) {
        flex: 1 1 auto !important;
        min-height: 0 !important; /* السر البرمجي لانكماش المكونات الداخلية */
        overflow-y: auto !important; /* يفتح التمرير الداخلي فقط إذا كانت الشاشة قصيرة جداً */
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
      }

      /* 6. تحشيم وانكماش الصور، الألعاب، والبطاقات التفاعلية تلقائياً */
      img, 
      svg, 
      canvas, 
      .card, 
      .board, 
      [class*="card"], 
      [class*="board"] {
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
        flex-shrink: 1 !important;
      }

      /* 7. تصغير تلقائي للخطوط والأزرار في الشاشات القصيرة */
      button, .btn, input, select {
        font-size: clamp(0.8rem, 2vh, 1.1rem) !important;
        padding: clamp(0.3rem, 1vh, 0.75rem) clamp(0.6rem, 1.5vw, 1.25rem) !important;
      }
    </style>
